<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Order App - Granja Emiluc</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand">
      <h1>Granja Emiluc</h1>
      <p class="tag">Pedidos por WhatsApp: <strong>+57 350 518 2091</strong></p>
    </div>
  </header>

  <main>
    <section id="catalog">
      <h2>Productos</h2>
      <div id="products" class="grid"></div>
    </section>

    <aside id="cart">
      <h2>Carrito</h2>
      <div id="cart-items" class="cart-list">(Carrito vacío)</div>
      <div id="cart-total">Total: $0</div>

      <h3>Datos del cliente</h3>
      <label>Nombre<br><input id="customer-name" type="text" placeholder="Nombre" /></label>
      <label>Teléfono<br><input id="customer-phone" type="text" placeholder="3001234567" /></label>
      <label>Dirección / Observaciones<br><textarea id="customer-address" placeholder="Opcional"></textarea></label>

      <button id="checkout">Enviar por WhatsApp</button>
    </aside>
  </main>

  <footer>
    <small>Creado para Granja Emiluc — WhatsApp: +57 350 518 2091</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
